[project]
name = "amie-sdg"
version = "0.5.0"
description = "Paper-aligned medical dialogue self-play prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "markdown-it-py>=3.0.0",
    "nh3>=0.2.20",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "playwright>=1.55.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
